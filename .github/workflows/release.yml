name: Build Standalone Binaries & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão para publicação (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact_name: limpeza-macos
            source_bin: dist/limpeza
          - os: windows-latest
            target: windows
            artifact_name: limpeza-windows.exe
            source_bin: dist/limpeza.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller limpeza.spec

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p release_assets
          cp "${{ matrix.source_bin }}" "release_assets/${{ matrix.artifact_name }}"
          cd release_assets
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_assets

      - name: Consolidate Release Assets & Checksums
        run: |
          mkdir -p release_dist
          find all_assets -type f -name "limpeza-*" -exec cp {} release_dist/ \;
          cd release_dist
          cat *.sha256 > checksums.sha256 2>/dev/null || true
          rm -f *.sha256 || true
          sha256sum limpeza-* > checksums.sha256
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          name: Release ${{ github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_dist/limpeza-macos
            release_dist/limpeza-windows.exe
            release_dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
